<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <style>
    body { width: 320px; padding: 15px; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    .row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
    .input-group { display: flex; gap: 5px; margin-bottom: 15px; }
    input[type="text"] { flex: 1; padding: 5px; border: 1px solid #ccc; border-radius: 4px; }
    button { cursor: pointer; background: #0a66c2; color: white; border: none; padding: 5px 10px; border-radius: 4px; font-weight: bold; }
    button.delete-btn { background: #dc3545; padding: 2px 6px; }
    ul { list-style: none; padding: 0; margin: 0; }
    li { display: flex; justify-content: space-between; background: #f3f2ef; margin-bottom: 5px; padding: 8px; border-radius: 4px; font-size: 14px;}
  </style>
</head>
<body>
  <div class="row">
    <strong>🔥 Bullshit Filtresi</strong>
    <label>
      <input type="checkbox" id="toggleExtension"> Açık/Kapalı
    </label>
  </div>
  <hr>
  <div class="input-group">
    <input type="text" id="newWord" placeholder="Yeni bir jargon ekle...">
    <button id="addBtn">Ekle</button>
  </div>
  <ul id="wordList"></ul>
  
  <script src="words.js"></script>
  <script src="popup.js"></script>
</body>
</html>
