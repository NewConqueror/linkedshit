<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>LinkedIn BS Filter</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="row top-row">
    <strong>🔥 Bullshit Filtresi</strong>
    <label>
      <input type="checkbox" id="toggleExtension"> Açık/Kapalı
    </label>
  </div>
  <hr>
  <div class="input-group">
    <input type="text" id="newWord" placeholder="Yeni bir jargon ekle...">
    <button id="addBtn">Ekle</button>
  </div>

  <div class="score-section">
    <div class="row">
      <strong>📊 Gönderi Skoru</strong>
      <label>
        <input type="checkbox" id="enableScoring"> Aktif
      </label>
    </div>

    <label class="range-label" for="scoreThreshold">
      Daraltma eşiği: <span id="scoreThresholdValue">6</span>
    </label>
    <input type="range" id="scoreThreshold" min="1" max="20" step="1" value="6">
    <div class="score-actions">
      <button id="applyScoreBtn" class="apply-btn" type="button">Uygula</button>
    </div>
    <p class="hint">Skor = yakalanan jargon + emoji adedi. Eşik üstündeki gönderiler daraltılır.</p>
  </div>

  <ul id="wordList"></ul>
  
  <script src="words.js"></script>
  <script src="popup.js"></script>
</body>
</html>
